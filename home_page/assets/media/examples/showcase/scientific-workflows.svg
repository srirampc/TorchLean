<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
<title id="title">Scientific learning and explicit checks</title><desc id="desc">A prediction plot and a residual certificate answer different questions. An FNO training curve is not a PDE certificate. PINN checks consume separate stated artifacts.
Python data preparation and native CPU/CUDA execution retain their external boundaries.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#102b4e}.heading{font-size:34px;font-weight:700}.sub{font-size:23px;fill:#49627c}.label{font-size:25px;font-weight:650}.body{font-size:22px}.note{font-size:21px;fill:#49627c}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#008d91" stroke-width="2"/></marker></defs>
