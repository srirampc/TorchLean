<text x="64" y="102" class="heading">Scientific learning and explicit checks</text><text x="64" y="151" class="sub">A prediction plot and a residual certificate answer different questions.</text><rect x="64" y="220" width="328" height="330" rx="16" fill="#dfebfa" stroke="#b5cbdc"/><text x="86" y="273" class="label">Prepare and train</text><text x="86" y="326" class="body">Burgers initial field u₀</text><text x="86" y="370" class="body">Target final field u(T)</text><text x="86" y="414" class="body">FNO model on typed data</text><text x="86" y="458" class="body">Losses and predictions</text><path d="M396 384 H426" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="436" y="220" width="328" height="330" rx="16" fill="#d9f0ed" stroke="#b5cbdc"/><text x="458" y="273" class="label">Inspect artifacts</text><text x="458" y="326" class="body">Held-out field errors</text><text x="458" y="370" class="body">PDE residual expression</text><text x="458" y="414" class="body">Network parameters</text><text x="458" y="458" class="body">Input boxes or samples</text><path d="M768 384 H798" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="808" y="220" width="328" height="330" rx="16" fill="#ece5f8" stroke="#b5cbdc"/><text x="830" y="273" class="label">Run a named check</text><text x="830" y="326" class="body">Residual interval replay</text><text x="830" y="370" class="body">Dataset containment</text><text x="830" y="414" class="body">Certificate consistency</text><text x="830" y="458" class="body">State remaining premises</text><text x="64" y="614" class="note">An FNO training curve is not a PDE certificate. PINN checks consume separate stated artifacts.</text><text x="64" y="650" class="note">Python data preparation and native CPU/CUDA execution retain their external boundaries.</text></svg>
