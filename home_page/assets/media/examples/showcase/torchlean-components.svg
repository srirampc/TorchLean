<text x="64" y="102" class="heading">Neural-network programs and formal reasoning</text><text x="64" y="151" class="sub">Shared definitions connect model construction, execution, and mathematical claims.</text><rect x="64" y="220" width="328" height="330" rx="16" fill="#dfebfa" stroke="#b5cbdc"/><text x="86" y="273" class="label">Write a model</text><text x="86" y="326" class="body">Shape-indexed tensors</text><text x="86" y="370" class="body">Layers and typed state</text><text x="86" y="414" class="body">Data and objectives</text><text x="86" y="458" class="body">FloatLib scalar formats</text><path d="M396 384 H426" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="436" y="220" width="328" height="330" rx="16" fill="#d9f0ed" stroke="#b5cbdc"/><text x="458" y="273" class="label">Execute or inspect</text><text x="458" y="326" class="body">CPU and LibTorch CUDA</text><text x="458" y="370" class="body">TorchLean autograd tape</text><text x="458" y="414" class="body">Canonical graph IR</text><text x="458" y="458" class="body">Explicit artifact bridges</text><path d="M768 384 H798" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="808" y="220" width="328" height="330" rx="16" fill="#ece5f8" stroke="#b5cbdc"/><text x="830" y="273" class="label">State the guarantee</text><text x="830" y="326" class="body">Shape and tensor laws</text><text x="830" y="370" class="body">Selected gradient proofs</text><text x="830" y="414" class="body">Numerical error bounds</text><text x="830" y="458" class="body">Certificate predicates</text><text x="64" y="614" class="note">Each theorem names its model and hypotheses. Each executable check names its artifact.</text><text x="64" y="650" class="note">Native kernels, external producers, and compiler execution remain explicit trust boundaries.</text></svg>
