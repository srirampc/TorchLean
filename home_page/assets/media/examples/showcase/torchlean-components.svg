<title id="title">Neural-network programs and formal reasoning</title><desc id="desc">Shared definitions connect model construction, execution, and mathematical claims. Each theorem names its model and hypotheses. Each executable check names its artifact.
Native kernels, external producers, and compiler execution remain explicit trust boundaries.</desc>
