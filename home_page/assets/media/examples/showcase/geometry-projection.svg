<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
<title id="title">What the camera certificate checks</title><desc id="desc">The artifact supplies the camera, points, box, image size, and tolerance. Acceptance concerns these projection and enclosure predicates.
It does not establish detector accuracy, pose correctness, or cuboid dimensions.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#102b4e}.heading{font-size:34px;font-weight:700}.sub{font-size:23px;fill:#49627c}.label{font-size:25px;font-weight:650}.body{font-size:22px}.note{font-size:21px;fill:#49627c}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#008d91" stroke-width="2"/></marker></defs>
<rect width="1200" height="760" rx="28" fill="#f8fbff"/><rect x="30" y="30" width="1140" height="700" rx="24" fill="white" stroke="#cad9e9"/>
<text x="64" y="102" class="heading">What the camera certificate checks</text><text x="64" y="151" class="sub">The artifact supplies the camera, points, box, image size, and tolerance.</text><rect x="64" y="220" width="328" height="330" rx="16" fill="#dfebfa" stroke="#b5cbdc"/><text x="86" y="273" class="label">Artifact</text><text x="86" y="326" class="body">Camera P : 3 × 4</text><text x="86" y="370" class="body">Points : n × 3</text><text x="86" y="414" class="body">Box : [xmin, ymin,</text><text x="86" y="458" class="body">          xmax, ymax]</text><text x="86" y="502" class="body">Nonnegative tolerance τ</text><path d="M396 384 H426" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="436" y="220" width="328" height="330" rx="16" fill="#d9f0ed" stroke="#b5cbdc"/><text x="458" y="273" class="label">Recompute</text><text x="458" y="326" class="body">P · [x, y, z, 1]</text><text x="458" y="370" class="body">Require positive depth</text><text x="458" y="414" class="body">Divide to obtain (u, v)</text><text x="458" y="458" class="body">Check image bounds</text><path d="M768 384 H798" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="808" y="220" width="328" height="330" rx="16" fill="#ece5f8" stroke="#b5cbdc"/><text x="830" y="273" class="label">Check enclosure</text><text x="830" y="326" class="body">xmin − τ ≤ u ≤ xmax + τ</text><text x="830" y="370" class="body">ymin − τ ≤ v ≤ ymax + τ</text><text x="830" y="414" class="body">For every supplied point</text><text x="830" y="458" class="body">Return checker result</text><text x="64" y="614" class="note">Acceptance concerns these projection and enclosure predicates.</text><text x="64" y="650" class="note">It does not establish detector accuracy, pose correctness, or cuboid dimensions.</text></svg>
