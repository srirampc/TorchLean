<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
<title id="title">PyTorch and TorchLean exchange artifacts</title><desc id="desc">The checked object is an imported graph or tensor payload. A successful import does not prove arbitrary Python semantics or native-kernel equivalence.
Parity checks give evidence for the inputs, operators, and provider actually exercised.</desc>
<defs><style>text{font-family:system-ui,sans-serif;fill:#102b4e}.heading{font-size:34px;font-weight:700}.sub{font-size:23px;fill:#49627c}.label{font-size:25px;font-weight:650}.body{font-size:22px}.note{font-size:21px;fill:#49627c}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#008d91" stroke-width="2"/></marker></defs>
<rect width="1200" height="760" rx="28" fill="#f8fbff"/><rect x="30" y="30" width="1140" height="700" rx="24" fill="white" stroke="#cad9e9"/>
<text x="64" y="102" class="heading">PyTorch and TorchLean exchange artifacts</text><text x="64" y="151" class="sub">The checked object is an imported graph or tensor payload.</text><rect x="64" y="220" width="328" height="330" rx="16" fill="#dfebfa" stroke="#b5cbdc"/><text x="86" y="273" class="label">PyTorch</text><text x="86" y="326" class="body">Weights and examples</text><text x="86" y="370" class="body">torch.export / FX graph</text><text x="86" y="414" class="body">External producer</text><path d="M396 384 H426" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="436" y="220" width="328" height="330" rx="16" fill="#d9f0ed" stroke="#b5cbdc"/><text x="458" y="273" class="label">Artifact bridge</text><text x="458" y="326" class="body">JSON tensor payloads</text><text x="458" y="370" class="body">Operation tags and shapes</text><text x="458" y="414" class="body">Explicit supported subset</text><text x="458" y="458" class="body">Reject malformed data</text><path d="M768 384 H798" stroke="#008d91" stroke-width="3" marker-end="url(#arrow)"/><rect x="808" y="220" width="328" height="330" rx="16" fill="#ece5f8" stroke="#b5cbdc"/><text x="830" y="273" class="label">TorchLean</text><text x="830" y="326" class="body">Parse and check shapes</text><text x="830" y="370" class="body">Build the represented IR</text><text x="830" y="414" class="body">Execute supported graphs</text><text x="830" y="458" class="body">Compare selected outputs</text><text x="64" y="614" class="note">A successful import does not prove arbitrary Python semantics or native-kernel equivalence.</text><text x="64" y="650" class="note">Parity checks give evidence for the inputs, operators, and provider actually exercised.</text></svg>
